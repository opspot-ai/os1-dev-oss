name: OS1Native
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    SWIFT_VERSION: 5.0
    CODE_SIGN_STYLE: Automatic
configs:
  Debug: debug
  Release: release
targets:
  OS1Native:
    type: application
    platform: iOS
    sources:
      - path: OS1Native
      - path: Config/GeneratedBridgeConfig.swift
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.os1
        PRODUCT_NAME: OS1
        INFOPLIST_FILE: OS1Native/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: false
  OS1NativeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OS1NativeUITests
    dependencies:
      - target: OS1Native
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.os1.tests
        TEST_TARGET_NAME: OS1Native
